<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimizador Trifásico Pro - Capas Separadas y Exportación Agrupada</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
        
        .panel { padding: 12px 18px; background: #1e1e24; color: white; display: flex; gap: 12px; align-items: center; z-index: 1000; flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-bottom: 1px solid #333; }
        
        .file-input-wrapper { display: inline-block; position: relative; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .btn-file { background: #8e44ad; color: white; padding: 8px 14px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .btn-file:hover { background: #9b59b6; }
        .btn-file.loaded { background: #27ae60; }

        button { cursor: pointer; padding: 9px 15px; border: none; border-radius: 6px; font-weight: 600; transition: all 0.2s ease; font-size: 0.9em; display: inline-flex; align-items: center; gap: 6px; }
        button:hover { transform: translateY(-1px); filter: brightness(1.1); }
        
        #btn-add { background: #3498db; color: white; display: none; }
        #btn-opt { background: #27ae60; color: white; display: none; }
        #btn-save { background: #e67e22; color: white; display: none; }
        
        .active-draw { background: #f1c40f !important; color: #000 !important; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(241, 196, 15, 0); }
            100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); }
        }

        .stats { background: #282c34; padding: 8px 18px; display: flex; justify-content: space-around; border-bottom: 1px solid #3e4451; font-weight: 500; font-size: 0.85em; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        
        #map-container { position: relative; flex-grow: 1; }
        #map { width: 100%; height: 100%; cursor: crosshair; background: #191919; }

        #toast-banner {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            background: rgba(30, 30, 36, 0.95);
            border: 2px solid #3498db;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            font-size: 0.95em;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            max-width: 90%;
            text-align: center;
        }

        #toast-banner.show { display: flex; animation: slideDown 0.3s forwards; }
        #toast-banner.warning { border-color: #f1c40f; }
        #toast-banner.success { border-color: #27ae60; }

        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .status-badge { background: #333; padding: 4px 10px; border-radius: 12px; font-size: 0.8em; color: #f1c40f; margin-left: auto; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="panel">
    <!-- Cargar Puntos -->
    <div class="file-input-wrapper">
        <div class="btn-file" id="lbl-pts">📍 1. KML Puntos</div>
        <input type="file" id="upload-puntos" accept=".kml">
    </div>
    
    <!-- Cargar Contornos -->
    <div class="file-input-wrapper">
        <div class="btn-file" id="lbl-polys">🔲 2. KML Contornos</div>
        <input type="file" id="upload-contornos" accept=".kml">
    </div>
    
    <button id="btn-add" onclick="toggleModoDibujo()">➕ Punto Manual</button>
    <button id="btn-opt" onclick="ejecutarTrifasico()">🚀 Calcular Ruta</button>
    <button id="btn-save" onclick="guardarKML()">💾 Exportar KML</button>
    
    <div id="status" class="status-badge">Carga los archivos KML...</div>
</div>

<div class="stats">
    <div class="stat-item" style="color:#ff4d4d">● Asfalto</div>
    <div class="stat-item" style="color:#ff9900">● Conexión Punto-Asfalto</div>
    <div class="stat-item" style="color:#2ecc71">● Conexión Perímetro-Asfalto</div>
    <div class="stat-item" style="color:#f1c40f">● Alternativas Rurales</div>
</div>

<div id="map-container">
    <div id="toast-banner">
        <span id="toast-text">Mensaje de estado</span>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>

<script>
    const capaEsriCallejero = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
    });

    const capaOrtofoto = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
    });

    const map = L.map('map', { 
        center: [39.47, -0.37], 
        zoom: 12,
        layers: [capaEsriCallejero] 
    });

    let puntos = [];
    let contornosPoligonos = [];

    let capasRuta = {
        asf: L.featureGroup().addTo(map),
        rur: L.featureGroup().addTo(map),
        per: L.featureGroup().addTo(map),
        alt: L.featureGroup().addTo(map),
        cnt: L.featureGroup().addTo(map),
        mar: L.featureGroup().addTo(map)
    };

    let layerControl = L.control.layers({
        "Mapa Callejero (Esri)": capaEsriCallejero,
        "Satélite (Ortofoto)": capaOrtofoto
    }, {
        "🔲 Contornos / Recintos": capasRuta.cnt,
        "📍 Marcadores / Puntos": capasRuta.mar,
        "🛣️ Líneas de Asfalto": capasRuta.asf,
        "🟠 Conexión Punto-Asfalto": capasRuta.rur,
        "🟢 Conexión Perímetro-Asfalto": capasRuta.per,
        "🟡 Líneas de Alternativa": capasRuta.alt
    }, { collapsed: false }).addTo(map);

    let exportData = {
        asfalto: [],
        conexionPunto: [],
        conexionPerimetro: [],
        alternativa: []
    };
    
    let pInicioIdx = null;
    let modoDibujo = false;

    function mostrarMensaje(texto, tipo = 'info') {
        const toast = document.getElementById('toast-banner');
        const textSpan = document.getElementById('toast-text');
        textSpan.innerHTML = texto;
        
        toast.className = 'show';
        if (tipo === 'warning') toast.classList.add('warning');
        if (tipo === 'success') toast.classList.add('success');

        setTimeout(() => { toast.className = ''; }, 7000);
    }

    document.getElementById('upload-puntos').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const kml = new DOMParser().parseFromString(ev.target.result, 'text/xml');
                const geo = toGeoJSON.kml(kml);
                const nuevosPuntos = geo.features.filter(f => f.geometry && f.geometry.type === 'Point');

                if (nuevosPuntos.length === 0) {
                    mostrarMensaje("⚠️ No se encontraron puntos en este KML.", "warning");
                    return;
                }

                puntos = nuevosPuntos;
                document.getElementById('lbl-pts').classList.add('loaded');
                document.getElementById('lbl-pts').innerText = `📍 Puntos (${puntos.length})`;
                document.getElementById('btn-add').style.display = 'inline-flex';
                
                actualizarPuntosEnMapa();
                if (puntos.length) map.fitBounds(capasRuta.mar.getBounds(), { padding: [30, 30] });

                mostrarMensaje(`✅ <b>${puntos.length} puntos cargados</b>. Selecciona el punto de <b>INICIO/REGRESO</b>.`, "success");
            } catch (err) {
                mostrarMensaje("❌ Error al cargar el KML de puntos.", "warning");
            }
        };
        reader.readAsText(file);
    });

    document.getElementById('upload-contornos').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const kml = new DOMParser().parseFromString(ev.target.result, 'text/xml');
                const geo = toGeoJSON.kml(kml);
                contornosPoligonos = geo.features.filter(f => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'));

                if (contornosPoligonos.length === 0) {
                    mostrarMensaje("⚠️ No se encontraron polígonos/contornos en este KML.", "warning");
                    return;
                }

                document.getElementById('lbl-polys').classList.add('loaded');
                document.getElementById('lbl-polys').innerText = `🔲 Contornos (${contornosPoligonos.length})`;

                capasRuta.cnt.clearLayers();
                L.geoJSON(geo, {
                    style: { color: '#3498db', weight: 2, fillOpacity: 0.15 }
                }).addTo(capasRuta.cnt);

                mostrarMensaje(`✅ <b>${contornosPoligonos.length} contornos cargados</b> correctamente.`, "success");
            } catch (err) {
                mostrarMensaje("❌ Error al cargar el KML de contornos.", "warning");
            }
        };
        reader.readAsText(file);
    });

    function toggleModoDibujo() {
        if (puntos.length === 0) {
            mostrarMensaje("⚠️ Primero debes cargar un KML de puntos.", "warning");
            return;
        }
        modoDibujo = !modoDibujo;
        const btnAdd = document.getElementById('btn-add');
        btnAdd.classList.toggle('active-draw');
        
        if (modoDibujo) {
            document.getElementById('status').innerText = "Modo Dibujo Activo";
            mostrarMensaje("📍 Haz clic en el mapa para situar un nuevo punto.", "info");
        } else {
            document.getElementById('status').innerText = "Listo";
        }
    }

    map.on('click', (e) => {
        if (!modoDibujo) return;
        
        puntos.push({ 
            type: "Feature", 
            geometry: { 
                type: "Point", 
                coordinates: [e.latlng.lng, e.latlng.lat] 
            } 
        });

        actualizarPuntosEnMapa();
        toggleModoDibujo();
        mostrarMensaje("🎯 Punto añadido. Haz clic en un marcador para fijar el INICIO.", "warning");
    });

    function actualizarPuntosEnMapa() {
        capasRuta.mar.clearLayers();
        
        puntos.forEach((p, i) => {
            const esInicio = (i === pInicioIdx);
            p.properties = p.properties || {};
            p.properties.esInicio = esInicio;
            
            const marker = L.circleMarker([p.geometry.coordinates[1], p.geometry.coordinates[0]], {
                radius: esInicio ? 12 : 7, 
                color: esInicio ? '#ffffff' : '#2980b9', 
                fillColor: esInicio ? '#e74c3c' : '#3498db', 
                fillOpacity: 0.9,
                weight: esInicio ? 3 : 2
            }).addTo(capasRuta.mar);

            marker.bindTooltip(esInicio ? "🏁 INICIO/REGRESO" : `Punto ${i + 1}`, {
                permanent: esInicio,
                direction: 'top'
            });

            marker.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                pInicioIdx = i;
                document.getElementById('btn-opt').style.display = 'inline-flex';
                actualizarPuntosEnMapa();
                mostrarMensaje(`🏁 Punto #${i + 1} seleccionado como <b>INICIO/REGRESO</b>.`, "success");
            });
        });
    }

    async function ejecutarTrifasico() {
        if (pInicioIdx === null) {
            mostrarMensaje("⚠️ Por favor, selecciona un punto de INICIO/REGRESO.", "warning");
            return;
        }

        document.getElementById('status').innerText = "Calculando itinerario...";
        mostrarMensaje("⚙️ Procesando itinierario y calculando perímetros...", "info");

        capasRuta.asf.clearLayers(); 
        capasRuta.rur.clearLayers(); 
        capasRuta.per.clearLayers();
        capasRuta.alt.clearLayers();
        
        exportData = {
            asfalto: [],
            conexionPunto: [],
            conexionPerimetro: [],
            alternativa: []
        };

        let pool = [...puntos];
        let orden = [pool.splice(pInicioIdx, 1)[0]];
        
        while(pool.length) {
            pool.sort((a,b) => turf.distance(orden[orden.length-1], a) - turf.distance(orden[orden.length-1], b));
            orden.push(pool.shift());
        }
        orden.push(orden[0]); // Retorno al punto inicial

        try {
            for (let i = 0; i < orden.length - 1; i++) {
                const p1Node = orden[i];
                const p1 = p1Node.geometry.coordinates;
                const p2 = orden[i+1].geometry.coordinates;
                const s1 = await snap(p1);
                const s2 = await snap(p2);

                // 1. Tramo Asfalto (OSRM)
                const resA = await fetch(`https://router.project-osrm.org/route/v1/driving/${s1[0]},${s1[1]};${s2[0]},${s2[1]}?overview=full&geometries=geojson`);
                const dataA = await resA.json();
                
                if (dataA.routes && dataA.routes[0]) {
                    const geom = dataA.routes[0].geometry;
                    L.geoJSON(geom, { style: { color: '#ff4d4d', weight: 5, opacity: 0.9 } }).addTo(capasRuta.asf);
                    exportData.asfalto.push({ geom: geom, color: 'ff0000ff', name: `Asfalto Tramo ${i+1}` });
                }

                // OMITIR cálculo de líneas secundarias si el punto es el ORIGEN/DESTINO
                const esPuntoInicial = p1Node.properties && p1Node.properties.esInicio;

                if (!esPuntoInicial) {
                    // 2. Línea Naranja Discontinua (Punto/Centroide a Asfalto)
                    const geomRur = { type: "LineString", coordinates: [p1, s1] };
                    L.geoJSON(geomRur, { style: { color: '#ff9900', weight: 4, dashArray: '5, 8' } }).addTo(capasRuta.rur);
                    exportData.conexionPunto.push({ geom: geomRur, color: 'ff0099ff', name: `Conexión Punto ${i+1}` });

                    // 3. Línea Verde Discontinua (Del Asfalto al Perímetro del Contorno)
                    let pPerimetro = p1;

                    if (contornosPoligonos.length > 0) {
                        const ptTurf = turf.point(p1);
                        let recinto = contornosPoligonos.find(poly => turf.booleanPointInPolygon(ptTurf, poly));

                        if (!recinto) {
                            let minDist = Infinity;
                            contornosPoligonos.forEach(poly => {
                                const d = turf.distance(ptTurf, turf.centroid(poly));
                                if (d < minDist) {
                                    minDist = d;
                                    recinto = poly;
                                }
                            });
                        }

                        if (recinto) {
                            const puntoAsfaltoTurf = turf.point(s1);
                            const linePerimetro = turf.polygonToLine(recinto);
                            const lineTarget = linePerimetro.type === 'FeatureCollection' ? linePerimetro.features[0] : linePerimetro;
                            
                            const nearestPoint = turf.nearestPointOnLine(lineTarget, puntoAsfaltoTurf);
                            pPerimetro = nearestPoint.geometry.coordinates;
                        }
                    }

                    const geomPer = { type: "LineString", coordinates: [s1, pPerimetro] };
                    L.geoJSON(geomPer, { style: { color: '#2ecc71', weight: 4, dashArray: '4, 6' } }).addTo(capasRuta.per);
                    exportData.conexionPerimetro.push({ geom: geomPer, color: 'ff71cc2e', name: `Perímetro Punto ${i+1}` });
                }

                // 4. Alternativas Rurales
                if (i < orden.length - 2) {
                    const resAlt = await fetch(`https://router.project-osrm.org/route/v1/foot/${p1[0]},${p1[1]};${orden[i+2].geometry.coordinates[0]},${orden[i+2].geometry.coordinates[1]}?overview=full&geometries=geojson`);
                    const dataAlt = await resAlt.json();
                    if (dataAlt.routes && dataAlt.routes[0]) {
                        const geomAlt = dataAlt.routes[0].geometry;
                        L.geoJSON(geomAlt, { style: { color: '#f1c40f', weight: 3, opacity: 0.6 } }).addTo(capasRuta.alt);
                        exportData.alternativa.push({ geom: geomAlt, color: 'ff00ffff', name: `Alternativa ${i+1}` });
                    }
                }
            }

            document.getElementById('status').innerText = "Ruta completada";
            document.getElementById('btn-save').style.display = 'inline-flex';
            mostrarMensaje("🎉 <b>Cálculo finalizado</b>. Las conexiones no han sido calculadas en el origen.", "success");
        } catch (error) {
            document.getElementById('status').innerText = "Error";
            mostrarMensaje("❌ Error en el proceso de ruteo.", "warning");
        }
    }

    async function snap(c) {
        try {
            const r = await fetch(`https://router.project-osrm.org/nearest/v1/driving/${c[0]},${c[1]}`);
            const d = await r.json(); 
            return d.waypoints[0].location;
        } catch(e) { 
            return c; 
        }
    }

    function generarFolderKML(nombreFolder, elementos) {
        if (!elementos || elementos.length === 0) return '';
        return `
        <Folder>
            <name>${nombreFolder}</name>
            ${elementos.map(x => `
            <Placemark>
                <name>${x.name}</name>
                <Style>
                    <LineStyle>
                        <color>${x.color}</color>
                        <width>4</width>
                    </LineStyle>
                </Style>
                <LineString>
                    <coordinates>${x.geom.coordinates.map(c => c.join(',')).join(' ')}</coordinates>
                </LineString>
            </Placemark>`).join('')}
        </Folder>`;
    }

    function guardarKML() {
        let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
    <Document>
        <name>Itinerario Agrupado</name>
        ${generarFolderKML('Líneas Rojas (Asfalto)', exportData.asfalto)}
        ${generarFolderKML('Líneas Naranjas (Conexión Punto-Asfalto)', exportData.conexionPunto)}
        ${generarFolderKML('Líneas Verdes (Conexión Perímetro-Asfalto)', exportData.conexionPerimetro)}
        ${generarFolderKML('Líneas Amarillas (Alternativas Rurales)', exportData.alternativa)}
    </Document>
</kml>`;
        
        const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "itinerario_agrupado.kml";
        a.click();
    }
</script>
</body>
</html>
